[project]
name = "digital-pet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "kittentts>=0.1.3",
    "ollama>=0.6.1",
    "openai>=2.31.0",
    "piper-tts>=1.4.2",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "transformers>=5.5.4",
    "uvicorn>=0.44.0",
    "vosk>=0.3.45",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
	{ index = "pytorch-cpu" }
]
torchaudio = [
	{ index = "pytorch-cpu" }
]
[dependency-groups]
dev = [
    "ipython>=9.12.0",
    "mypy>=1.20.1",
    "ruff>=0.15.11",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["F541"]
