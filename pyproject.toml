[project]
name = "digital-pet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "kittentts>=0.1.3",
    "matplotlib>=3.10.8",
    "mediapipe==0.10.5",
    "ollama>=0.6.1",
    "openai>=2.31.0",
    "piper-tts>=1.4.2",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "torch==2.6.0",
    "torchaudio>=2.11.0",
    "transformers>=5.5.4",
    "ultralytics>=8.4.39",
    "uvicorn>=0.44.0",
    "vosk>=0.3.45",
    "watchdog>=6.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
	{ index = "pytorch-cpu" }
]
torchaudio = [
	{ index = "pytorch-cpu" }
]
[dependency-groups]
dev = [
    "ipython>=8.0.0",
    "mypy>=1.20.1",
    "ruff>=0.15.11",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["F541", "E501"]

[tool.uv]
python-preference = "system"
